<style>
  :root {
    --width-max: 864px;
    --font-size-primary: 1.25em;
    --font-size-secondary: 1em;
  }

  :root[data-theme="light"] {
    --bg-color-primary: #fdfdfd;
    --bg-color-secondary: #f2f4f7;
    --text-color-primary: #1a1a1a;
    --text-color-secondary: #444;
    --text-color-tertiary: #8c8c8c;
    --link-color: #0066cc;
    --link-visited-color: #551a8b;
    --border-color: #d0d7de;
    --upvoted-color: #fa8072;
  }

  :root[data-theme="dark"] {
    --bg-color-primary: #121212;
    --bg-color-secondary: #1c1f24;
    --text-color-primary: #e5e5e5;
    --text-color-secondary: #b3b3b7;
    --text-color-tertiary: #a0a0a0;
    --link-color: #6da6ff;
    --link-visited-color: #b388ff;
    --border-color: #30363d;
    --upvoted-color: #ff6b6b;
  }

  nav {
    align-items: center;
    display: flex;
    min-height: 2rem;
  }

  .theme-toggle {
    align-items: center;
    background: transparent;
    border: 0;
    border-radius: 50%;
    color: var(--text-color-secondary);
    cursor: pointer;
    display: inline-flex;
    height: 2rem;
    justify-content: center;
    margin-left: auto;
    padding: 0;
    transition: background-color 0.15s ease, color 0.15s ease;
    width: 2rem;
  }

  .theme-toggle:hover {
    background: var(--bg-color-secondary);
    color: var(--text-color-primary);
  }

  .theme-toggle:focus-visible {
    outline: 2px solid var(--link-color);
    outline-offset: 2px;
  }

  .theme-toggle svg {
    fill: none;
    height: 1.15rem;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
    width: 1.15rem;
  }

  :root[data-theme="light"] .theme-toggle__sun,
  :root[data-theme="dark"] .theme-toggle__moon {
    display: none;
  }

  input,
  time {
    font-size: 0.95em;
  }

  .image-caption figcaption {
    color: #6b7280;
    font-style: normal;
    margin: 0.6em auto 1.4em;
    text-align: center;
  }

  .image-caption figcaption a {
    color: inherit;
  }

  .toc-nav ul ul {
    padding-left: 1.5rem;
  }

  @media (min-width: 801px) {
    .toc-nav a {
      color: var(--text-color-tertiary);
    }

    .toc-nav a.active,
    .toc-nav a:hover {
      color: var(--text-color-primary);
    }
  }

  ul.blog-posts li {
    align-items: baseline;
    column-gap: 5px;
  }

  ul.blog-posts li span.grouped {
    flex: 0 0 105px;
    white-space: nowrap;
  }

  ul.blog-posts li span.ungrouped {
    flex: 0 0 142px;
    white-space: nowrap;
  }

  content h2 {
    margin-top: 2.6rem;
  }

  content h2:first-child {
    margin-top: 1rem;
  }

  .video-embed {
    aspect-ratio: 16 / 9;
    margin: 1.5rem 0;
    width: 100%;
  }

  .video-embed iframe {
    border: 0;
    height: 100%;
    width: 100%;
  }

  pre,
  code {
    font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
  }

  code {
    background-color: rgba(175, 184, 193, 0.2);
    border-radius: 6px;
    color: #24292f;
    font-size: 0.9em;
    padding: 0.2em 0.4em;
  }

  pre code {
    background-color: transparent;
    border-radius: 0;
    color: inherit;
    padding: 0;
    white-space: pre;
  }

    background: #f6f8fa;
    color: #24292f;
  }

    border: 1px solid #d0d7de;
    border-radius: 6px;
    margin: 1.2rem 0;
    overflow: hidden;
  }

  div.highlight pre {
    margin: 0;
