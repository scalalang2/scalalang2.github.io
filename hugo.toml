baseURL = "https://scalalang2.github.io/"
theme = "hugo-bearneo"
title = "scalalang2"
defaultContentLanguage = "ko"
locale = "ko-KR"
enableRobotsTXT = true
enableGitInfo = true
disableKinds = ["taxonomy"]
ignoreErrors = ["error-disable-taxonomy"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[permalinks]
  blog = "/p/:slug/"
  tags = "/blog/:slug/"

[params]
  title = "scalalang2"
  description = "분산 시스템, 데이터베이스, 클라우드 인프라, AI/ML, 게임 서버를 다루는 scalalang2의 기술 블로그."
  dateFormat = "2006-01-02"
  copyright = "Copyright © scalalang2."
  groupByYear = true
  showPostCount = true
  postSearch = true
  toc = true
  imageZoom = true
  upvote = false

  [params.footer]
    hideCopyright = true
    hideSitemap = true
    hideMadeWithLine = true
    hideRSSAndEmail = true

  [params.RSS]
    enableRSS = true
    pageLimit = 20

  [params.author]
    name = "scalalang2"
    email = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

  [markup.highlight]
    noClasses = false
    lineNos = false
